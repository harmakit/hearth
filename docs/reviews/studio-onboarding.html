<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearth Studio · контекстные подсказки</title>
  <link rel="stylesheet" href="../../renderer/styles.css">
  <link rel="stylesheet" href="../../renderer/work.css">
  <link rel="stylesheet" href="../../renderer/workspace.css">
  <style>
    .preview-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 20px; padding:8px 16px; color:var(--muted); background:var(--surface); border-bottom:1px solid var(--line); font-size:12px }
    .preview-controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px }
    .preview-controls label { display:flex; flex-wrap:wrap; align-items:center; gap:5px }
    .preview-bar select { max-width:100%; padding:3px 6px; background:var(--paper); border:1px solid var(--control-line); border-radius:4px }
    .shell { min-height:calc(100dvh - 43px) }
    .rail { height:calc(100dvh - 43px); min-height:max-content }
    .topbar { min-height:53px }
    main { margin:0; max-width:1200px }
    .today-heading { margin-bottom:8px }
    .mock-path { color:var(--muted); overflow-wrap:anywhere }
    .empty-actions { width:100% }
    .empty-actions > button { justify-self:start }
    .placed { container-type:inline-size; min-width:0; width:100% }
    .heading-control { flex:0 1 555px }
    .heading-control:has(.placed.standalone) { flex-basis:auto }
    .hint-row { display:grid; grid-template-columns:minmax(0,max-content) minmax(0,23rem); gap:20px; align-items:center; justify-content:start; min-width:0 }
    .hint-row > button:first-child { justify-self:start }
    .hint-row > .today-open { text-align:start }
    .hint-card { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 28px; align-items:start; gap:5px; padding:8px 5px 8px 11px; border:1px solid light-dark(#91a684,#617653); border-radius:5px; background:light-dark(#f3f8ee,#272e26); color:var(--ink); font-size:13px; line-height:1.4 }
    .hint-card p { align-self:center }
    .hint-arrow { --nudge-x:-4px; --nudge-y:0px; position:absolute; inset-inline-start:-15px; top:50%; width:15px; height:12px; display:block; color:var(--accent); transform:translateY(-50%); pointer-events:none }
    .hint-arrow::before { position:absolute; content:""; inset-inline-start:1px; top:5px; width:14px; border-top:1.5px solid currentColor }
    .hint-arrow::after { position:absolute; content:""; inset-inline-start:1px; top:2px; width:7px; height:7px; border:solid currentColor; border-width:0 0 1.5px 1.5px; transform:rotate(45deg) }
    .hint-close { width:28px; height:28px; padding:0; line-height:26px; border:0; border-radius:4px; background:transparent; color:var(--muted); font-size:17px }
    .hint-close:hover { background:var(--surface-raised); color:var(--ink) }
    body:has(#product-dialog[open]) main .hint-card { visibility:hidden }
    .hint-row .focus-heading { min-width:0; margin:0; font-weight:620 }
    .dialog-footer { padding:11px 15px; display:grid; gap:8px; border-top:1px solid var(--line) }
    .dialog-footer .placed { width:100% }
    .preview-sheet { width:min(640px,calc(100% - 32px)); max-height:calc(100dvh - 32px); }
    .preview-sheet form { max-height:inherit; display:flex; flex-direction:column; gap:0; padding:0 }
    .preview-sheet .dialog-heading { padding:10px 15px; border-bottom:1px solid var(--line) }
    .preview-sheet .form-body { min-height:0; overflow:auto; display:grid; gap:11px; padding:15px }
    .preview-sheet .field { min-width:0 }
    .preview-sheet textarea { min-height:55px }
    .preview-sheet code { overflow-wrap:anywhere }
    .confirm-sheet { width:min(360px,calc(100% - 32px)) }
    .confirm-sheet .dialog-footer { display:flex; justify-content:end; flex-wrap:wrap }
    .failure-note { border-inline-start:2px solid var(--blocked); padding-inline-start:10px }
    .tabs-line { margin-bottom:12px; padding-bottom:9px; border-bottom:1px solid var(--line) }
    .tabs-line [aria-current="page"] { color:var(--accent); background:var(--accent-soft); border-radius:4px }
    @media (prefers-reduced-motion:no-preference) {
      .hint-card:not([data-still]) .hint-arrow { animation:point-in 850ms ease-in-out 3 }
      @keyframes point-in { 50% { translate:var(--nudge-x) var(--nudge-y) } }
    }
    @container (max-width: 445px) {
      .hint-row { grid-template-columns:minmax(0,1fr); gap:12px; justify-items:start }
      .hint-card { width:min(100%,23rem) }
      .hint-arrow { --nudge-x:0px; --nudge-y:-4px; inset-inline-start:20px; top:-13px; transform:rotate(90deg); transform-origin:6px 6px }
    }
    @media(max-width:760px) {
      .shell { grid-template-columns:138px minmax(0,1fr) }
      .split { grid-template-columns:1fr; gap:14px }
    }
    @media(max-width:460px) {
      .shell { display:block }
      .rail { position:static; height:auto; padding:8px }
      .rail nav { display:flex; flex-wrap:wrap }
      .rail nav button { min-height:28px; width:auto; padding-inline:5px }
      .rail .studio-controls { display:none }
      .rail .wordmark { font-size:15px }
      .rail .brand-mark { width:24px; height:24px; flex-basis:24px }
      .topbar { min-height:36px }
    }
    @media(max-width:460px), (max-height:440px) {
      .preview-sheet { overflow:auto }
      .preview-sheet form { display:block; max-height:none }
      .preview-sheet .form-body { overflow:visible }
    }
  </style>
</head>
<body>
  <header class="preview-bar">
    <span>Макет Hearth Studio · демонстрационные данные</span>
    <div class="preview-controls">
      <label>Экран для проверки
        <select id="fixture">
          <option value="empty">Пустое «Сегодня»</option>
          <option value="studios">Пустые «Все студии»</option>
          <option value="draft">Студия создана</option>
          <option value="provider">Подключение недоступно</option>
          <option value="pending">План на согласовании</option>
          <option value="training">Коуч готовится</option>
          <option value="complete">Рабочий файл готов</option>
          <option value="error">Проверка завершилась ошибкой</option>
        </select>
      </label>
      <label>Тема <select id="preview-theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
    </div>
  </header>
  <div class="shell">
    <aside class="rail">
      <div class="wordmark"><span class="brand-mark" aria-hidden="true"></span><span>Hearth <span>Studio</span></span></div>
      <nav id="app-nav" aria-label="Приложение"></nav>
      <div class="studio-controls">
        <label class="picker"><span>Студия</span><select id="studio-select" disabled><option>Нет студий</option></select></label>
        <button class="rail-button" type="button" data-act="new">＋ Новая студия</button>
      </div>
      <nav id="studio-nav" aria-label="Разделы студии" hidden></nav>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb"></div></header>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="preview-sheet" id="product-dialog" aria-labelledby="product-title"></dialog>
  <dialog class="preview-sheet confirm-sheet" id="hide-dialog" aria-labelledby="hide-title" aria-describedby="hide-description">
    <form method="dialog">
      <header class="row dialog-heading"><h2 id="hide-title">Отключить подсказки?</h2></header>
      <div class="form-body"><p id="hide-description">Их можно снова включить в настройках приложения.</p></div>
      <footer class="dialog-footer">
        <button class="action secondary" value="cancel" autofocus>Отмена</button>
        <button class="action" value="disable">Отключить</button>
      </footer>
    </form>
  </dialog>
<script>
  const $ = selector => document.querySelector(selector);
  const main = $('#content');
  const productDialog = $('#product-dialog');
  const hideDialog = $('#hide-dialog');
  const fixture = $('#fixture');
  const preferenceKey = 'hearth-studio-contextual-hints-preview-v1';
  const storage = {
    read() { try { return localStorage.getItem(preferenceKey); } catch { return null; } },
    write(enabled) { try { localStorage.setItem(preferenceKey, String(enabled)); } catch { /* Preview still works in this tab. */ } },
  };
  let enabled = storage.read() !== 'false';
  let screen = 'today';
  let state = 'empty';
  let workPane = 'board';
  let name = 'Мастерская Лугов';
  let draft;
  let dismissTrigger;
  let refreshTimer;
  let planVersion = 1;
  const fileName = 'studio/artifacts/characters.md';
  const workingTask = 'Придумать пять персонажей';
  const textReport = 'Подготовлены пять персонажей с краткими биографиями и связями между ними.';
  const appViews = {today:'Сегодня', studios:'Все студии', settings:'Настройки приложения'};
  const studioViews = {overview:'Обзор', inbox:'Входящие', work:'Работа'};
  const formStages = ['Что создаём', 'Папка и язык', 'Подключение директора'];
  const safe = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const button = (label, act, options = {}) => {
    const cls = options.kind === 'link' ? 'text-button' : options.kind === 'primary' ? 'action' : 'action secondary';
    return `<button type="button" class="${cls}" data-act="${act}"${options.target ? ` id="${options.target}"` : ''}${options.described ? ` aria-describedby="${options.described}"` : ''}${options.disabled ? ' disabled' : ''}>${label}</button>`;
  };
  const status = (label, type = '') => `<span class="status ${type}"><span></span>${label}</span>`;
  const nav = views => Object.entries(views).map(([key,label]) => `<button type="button" data-act="${key}"${screen === key ? ' aria-current="page"' : ''}>${label}</button>`).join('');
  const heading = (label, subtitle = '', action = '') => `<header class="page-heading"><div><h1 tabindex="-1">${label}</h1>${subtitle ? `<p class="muted">${subtitle}</p>` : ''}</div>${action ? `<div class="heading-control">${action}</div>` : ''}</header>`;
  const hasStudio = () => state !== 'empty';
  function byAction(key, label, action, description, kind = 'secondary') {
    const anchor = options => button(label, action, { ...options, kind });
    return byAnchor(key, anchor, description);
  }
  function byAnchor(key, anchor, description) {
    const target = 'target-' + key;
    const described = 'hint-' + key;
    if (!enabled) return `<div class="placed standalone">${anchor({target})}</div>`;
    return `<div class="placed"><div class="hint-row">${anchor({target,described})}
      <aside class="hint-card" aria-label="Подсказка">
        <span class="hint-arrow" aria-hidden="true"></span><p id="${described}">${description}</p>
        <button type="button" class="hint-close" data-hint-close="${target}" aria-label="Отключить подсказки">×</button>
      </aside>
    </div></div>`;
  }
  const newDescription = () => draft
    ? 'Здесь можно вернуться к сохранённым полям и закончить создание студии.'
    : 'Укажите, чем будет заниматься студия и где хранить проект. После создания вы сможете запросить у директора план.';
  const planDescription = 'Директор подготовил предложение. Откройте план, чтобы проверить задачи и состав команды.';
  const trainingDescription = 'Коуч проходит упражнение и проверку. Зависимые задачи дождутся готовности роли. Упражнение можно открыть и посмотреть.';
  const failureDescription = 'Здесь сохранён вывод проверки этой попытки. С ним можно исправить причину сбоя перед повторным запуском.';

  function today() {
    const title = draft ? 'Продолжить создание' : 'Новая студия';
    const create = hasStudio()
      ? button(title, 'new', {kind:'primary'})
      : byAction('today-create', title, 'new', newDescription(), 'primary');
    const item = state === 'pending'
      ? `<div class="panel padded">${byAction('today-plan', 'Согласовать план первого спринта', 'plan', planDescription, 'link')}</div>` : '';
    return `${heading('Сегодня', '', create)}<section class="stack compact"><h2>Нужно решение · ${item ? 1 : 0}</h2>
      ${item || '<p class="muted">Открытых решений нет.</p>'}</section>`;
  }

  function studios() {
    const create = draft ? 'Продолжить создание' : 'Создать студию';
    if (!hasStudio()) return `${heading('Все студии')}<section class="panel empty">
      <h2>Студий пока нет</h2><p class="muted">Создайте студию или импортируйте файл Hearth.</p>
      <div class="stack compact empty-actions">${byAction('studios-create', create, 'new', newDescription(), 'primary')}
      ${button('Импортировать файл Hearth', 'import')}</div></section>`;
    return `${heading('Все студии', '', button('Новая студия', 'new', {kind:'primary'}))}
      <section class="panel padded row">${button(safe(name), 'overview', {kind:'link'})}${status('В работе', 'good')}</section>`;
  }

  function recovery() {
    return `<section class="panel padded stack compact failure-note" aria-label="Следующий шаг">
      <h2>Следующий шаг</h2><p>Проверка завершилась ошибкой</p>
      <p class="muted">Откройте результаты проверок. По ним видно, какую проверку нужно исправить.</p>
      ${byAction('checks', 'Открыть результаты проверок', 'checks', failureDescription)}</section>`;
  }

  function overview() {
    const initial = ['draft','provider'].includes(state);
    const launch = initial ? '<p class="muted">Директор подготовит команду и план по вашей первой задаче. Работа по плану начнётся после вашего согласования.</p>' : '';
    const statusLabel = { draft:'Черновик', provider:'Черновик', planning:'Планирование', pending:'Ждёт согласования', training:'В работе', complete:'В работе', error:'Требуется внимание' }[state];
    const plan = {
      draft: () => byAction('prepare-plan','Подготовить план первого спринта','prepare','Директор предложит команду, задачи и порядок работы. Вы согласуете план перед запуском задач.', 'primary'),
      provider: () => button('Подготовить план первого спринта','prepare',{kind:'primary',disabled:true}) + byAction('provider','Настройки приложения','settings','Для подготовки плана директору нужно рабочее подключение. Проверьте провайдера в настройках приложения.'),
      planning: () => '<p role="status">Директор готовит предложение. Когда план будет готов, он появится здесь и во входящих.</p>',
      pending: () => byAction('open-plan','Посмотреть план','plan',planDescription,'primary'),
    }[state];
    const report = state === 'complete' ? `<section class="stack compact"><h2>Последний отчёт</h2>
      ${byAction('all-files','Все артефакты','artifacts','Отчёты и опубликованные файлы собраны в «Работа → Артефакты».')}
      <article class="panel report"><div class="excerpt">${textReport}</div><div class="padded stack compact"><h3>${workingTask}</h3>
      <div class="actions">${button('Читать отчёт','task')}${button('Открыть файл','file',{kind:'primary'})}</div></div></article></section>`
      : `<section class="stack compact"><div class="row"><h2>Последний отчёт</h2>${button('Все артефакты','artifacts')}</div>
      <div class="panel empty"><h2>Отчётов пока нет</h2><p class="muted">Здесь появится результат первой завершённой задачи.</p></div></section>`;
    const current = state === 'training' ? `<div class="panel padded stack compact">
      ${byAction('training','Подготовить коуча','exercise',trainingDescription,'link')}
      <div class="separator"></div><div class="row">${button(workingTask,'task',{kind:'link'})}${status('Ждёт подготовки','warn')}</div></div>`
      : state === 'error' ? `<div class="panel padded row">${button(workingTask,'task',{kind:'link'})}${status('Ошибка','attention')}</div>`
      : `<div class="panel empty"><h2>Нет текущих задач</h2><p class="muted">${initial ? 'Первые задачи появятся после согласования плана.' : 'Нет задач в работе и очереди.'}</p></div>`;
    return `${heading('Обзор студии', safe(name))}<div class="split">
      <div class="stack"><section class="panel padded stack compact"><div class="row"><h2>${initial ? 'Начало работы' : 'Студия'}</h2>${status(statusLabel, initial ? '' : 'good')}</div>
      ${launch}<p class="muted">Активные попытки: ${['planning','training'].includes(state) ? 1 : 0} из 1</p>${plan ? plan() : button('Открыть план','plan')}</section>
      ${state === 'error' ? recovery() : ''}${report}</div>
      <aside class="stack compact"><div class="row"><h2>Текущие задачи</h2>${button('Все задачи','board')}</div>${current}</aside>
    </div>`;
  }

  function inbox() {
    return `${heading('Входящие', safe(name))}<section class="panel empty">
      ${state === 'pending' ? `<h2>Согласование первого спринта</h2>${button('Посмотреть план','plan',{kind:'primary'})}`
        : '<h2>Нет открытых входящих</h2><p class="muted">Здесь появятся вопросы и решения по работе студии.</p>'}</section>`;
  }

  function work() {
    const tabs = `<nav class="actions tabs-line" aria-label="Разделы работы">
      <button type="button" class="text-button" data-act="board"${workPane === 'board' ? ' aria-current="page"' : ''}>Доска</button>
      <button type="button" class="text-button" data-act="artifacts"${workPane === 'artifacts' ? ' aria-current="page"' : ''}>Артефакты</button></nav>`;
    if (workPane === 'artifacts') {
      const rows = state === 'complete' ? `<section class="panel padded stack compact"><h2>Результаты задач</h2>
        ${button(workingTask,'task',{kind:'link'})}
        ${byAction('artifact',fileName,'file','Путь указан относительно папки проекта. Нажмите имя файла, чтобы открыть его, или «Показать в папке», чтобы увидеть эту версию в файловом менеджере.','link')}
        <div class="actions">${button('Показать в папке','location',{kind:'link'})}${button('Копировать путь','copy',{kind:'link'})}</div>
        <p id="file-feedback" role="status" class="muted" hidden></p></section>`
        : '<section class="panel empty"><h2>Артефактов пока нет</h2><p class="muted">Здесь появятся файлы планов и результаты задач.</p></section>';
      return heading('Работа', safe(name)) + tabs + rows;
    }
    const rows = state === 'training' ? byAction('board-training','Подготовить коуча','exercise',trainingDescription,'link') : '';
    return heading('Работа', safe(name)) + tabs + `<section class="panel padded stack compact"><h2>Доска</h2>
      ${rows}${['training','complete','error'].includes(state) ? button(workingTask,'task',{kind:'link'}) : '<p class="muted">На доске пока пусто</p>'}</section>`;
  }

  function settings() {
    return heading('Настройки приложения','Общие настройки') + `<div class="stack settings">
      <section class="stack compact"><h2>Подключения</h2><div class="panel padded stack compact">
        <div class="row"><h3>Codex</h3>${status(state === 'provider' ? 'Недоступно' : 'Подключение готово', state === 'provider' ? 'warn' : 'good')}</div>
        <div>${button('Проверить подключение','provider-check')}</div><p role="status" id="provider-feedback" hidden></p></div></section>
      <section class="stack compact"><h2>Интерфейс и уведомления</h2><div class="panel padded stack compact">
        <label class="field"><span>Тема оформления</span><select id="settings-theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
        <label class="checkbox-field"><input id="setting-hints" type="checkbox" aria-describedby="preference-help"${enabled ? ' checked' : ''}> <span>Показывать подсказки</span></label>
        <p class="muted" id="preference-help">Короткие пояснения рядом с рабочими действиями.</p>
      </div></section>
    </div>`;
  }

  const views = {today, studios, overview, inbox, work, settings};
  const hintId = surface => surface.querySelector('.hint-card p')?.id;
  function keepArrowStill(surface, previousHint) {
    if (previousHint && hintId(surface) === previousHint) surface.querySelector('.hint-card').dataset.still = '';
  }
  function render() {
    const previousHint = hintId(main);
    $('#app-nav').innerHTML = nav(appViews);
    $('#studio-nav').hidden = !hasStudio();
    $('#studio-nav').innerHTML = hasStudio() ? nav(studioViews) : '';
    $('#studio-select').innerHTML = '<option>' + (hasStudio() ? safe(name) : 'Нет студий') + '</option>';
    $('#breadcrumb').innerHTML = `<span>${studioViews[screen] ? safe(name) : 'Hearth Studio'}</span><span aria-hidden="true">/</span><strong>${appViews[screen] ?? studioViews[screen]}</strong>`;
    main.innerHTML = views[screen]();
    keepArrowStill(main, previousHint);
    if ($('#settings-theme')) $('#settings-theme').value = document.documentElement.dataset.theme;
  }
  function route(next) {
    screen = next;
    render();
    $('main h1')?.focus();
  }

  function sheet(title, body, footer = '', { form = false } = {}) {
    const previousHint = productDialog.open ? hintId(productDialog) : null;
    productDialog.innerHTML = `<form${form ? ' id="studio-form"' : ''}>
        <header class="row dialog-heading"><h2 id="product-title" tabindex="-1">${title}</h2>
          <button type="button" class="icon-button" data-act="close" aria-label="Закрыть">×</button></header>
        <div class="form-body">${body}</div>
        <footer class="dialog-footer">${footer || `<div class="actions">${button('Закрыть','close')}</div>`}</footer>
      </form>`;
    keepArrowStill(productDialog, previousHint);
    if (!productDialog.open) productDialog.showModal();
    (productDialog.querySelector('[data-start-focus]') ?? $('#product-title')).focus();
  }

  function newStudio() {
    draft ??= { step:0, name:'', brief:'', result:'', mode:'new', folder:'', folderName:'', provider:'Codex' };
    const step = draft.step;
    const textField = (label,id,value,required='') => `<label class="field"><span>${label}</span><input name="${id}" ${required} value="${safe(value)}"></label>`;
    const stepBody = [
      () => textField('Название студии','name',draft.name,'required data-start-focus') +
        `<label class="field"><span>Чем будет заниматься студия?</span><textarea name="brief" required placeholder="Опишите работу своими словами">${safe(draft.brief)}</textarea></label>
         <label class="field"><span>Какую первую задачу ставим студии?</span><textarea name="result" placeholder="Например, придумать пять персонажей и написать их биографии">${safe(draft.result)}</textarea></label>`,
      () => `<label class="field"><span>Где хранить проект?</span><select name="mode"><option value="new"${draft.mode === 'new' ? ' selected' : ''}>Создать новую папку с историей Git</option><option value="existing"${draft.mode === 'existing' ? ' selected' : ''}>Использовать существующую папку</option></select></label>
        <p class="mock-path">${draft.folder ? safe(draft.folder) : (draft.mode === 'existing' ? 'Папка проекта не выбрана' : 'Родительская папка не выбрана')}</p>
        <div>${button('Выбрать папку','select-folder')}</div>
        ${draft.mode === 'new' ? textField('Имя новой папки','folderName',draft.folderName,'required') + '<p class="muted">Hearth создаст пустой проект с локальной историей и отдельной веткой доставки.</p>' : ''}
        <p id="studio-error" class="error" role="alert" hidden>Выберите рабочую папку.</p>`,
      () => `<label class="field"><span>Подключение директора</span><select name="provider">${['Codex','Claude Code'].map(provider => `<option${draft.provider === provider ? ' selected' : ''}>${provider}</option>`).join('')}</select></label>
        ${textField('Модель директора','model',draft.model)}${textField('Усилие','effort',draft.effort)}
        <div class="row">${status('Подключение готово','good')}${button('Проверить подключение','provider-check')}</div>
        <p id="provider-feedback" role="status" hidden></p>`,
    ][step]();
    sheet('Новая студия', `<ol class="wizard-progress" aria-label="Шаги настройки">
      ${formStages.map((label,index) => `<li${index === step ? ' aria-current="step"' : ''}>${label}</li>`).join('')}</ol><h3>${formStages[step]}</h3>${stepBody}`,
      `<div class="actions">${step ? button('Назад','draft-back') : ''}${button('Сохранить черновик','save')}
      <button type="submit" class="action">${step === 2 ? 'Создать студию' : 'Далее'}</button></div>`, {form:true});
  }

  function plan({ revise = false } = {}) {
    const body = `<p>${status(state === 'pending' ? 'Ждёт согласования' : 'План утверждён', state === 'pending' ? 'warn' : 'good')} <span class="muted">Версия ${planVersion}</span></p>
      <h3>Цель спринта</h3><p>Заложить основу для сборника рассказов.</p>
      <h3>Задачи</h3><p>${workingTask}. Проверяющий — редактор.</p>
      <h3>Команда</h3><p>Автор и редактор.</p>
      ${revise ? '<label class="field"><span>Что изменить в плане?</span><textarea id="plan-feedback" data-start-focus></textarea></label>' : ''}`;
    const actions = state !== 'pending' ? '' : revise
      ? `<div class="actions">${button('Отправить на доработку','send-revision',{kind:'primary'})}</div>`
      : `<div class="actions">${button('Изменить задачи и приёмку','plan-tasks')}${button('Изменить состав','plan-team')}
        ${button('Вернуть на доработку','revise')}</div>
        ${byAction('approval','Подтвердить и запустить','approve','Проверьте задачи, состав команды и правила приёмки. Можно внести правки или вернуть план директору. Подтверждение ставит спринт в очередь.','primary')}`;
    sheet('План первого спринта',body,actions);
  }

  function planEditor(team) {
    const label = team ? 'Состав команды' : 'Задачи и приёмка';
    const body = team
      ? '<label class="field"><span>Проверяющий</span><select><option>Редактор</option><option>Директор</option></select></label>'
      : `<label class="field"><span>Название задачи</span><input value="${workingTask}"></label><label class="checkbox-field"><input type="checkbox"> Показать мне результат перед доставкой</label>`;
    sheet(label, body, `<div class="actions">${button('Сохранить план','save-plan',{kind:'primary'})}</div>`);
  }

  function exercise() {
    const title = ({target,described}) => `<h3 class="focus-heading" id="${target}" tabindex="-1"${described ? ` aria-describedby="${described}"` : ''}>Упражнение</h3>`;
    sheet('Подготовить коуча', `<div>${status('В работе','good')}</div>
      ${byAnchor('exercise',title,'Здесь видно, чему учится агент и прошёл ли он проверку. Рабочий результат появится в задаче проекта.')}
      <p>Коуч разбирает пример проверки результата. После упражнения директор проверит, готова ли роль к работе.</p>
      <h3>Зависимые задачи</h3><div>${button(workingTask,'task',{kind:'link'})}</div>`);
  }

  function task() {
    const detail = state === 'error' ? recovery() : state === 'complete'
      ? `<p>${status('Завершено','good')}</p><p>${textReport}</p><div>${button('Открыть файл','file',{kind:'primary'})}</div>`
      : `<p>${status('Ожидает подготовки','warn')}</p><p>Задача ждёт готовности коуча.</p><div>${button('Подготовить коуча','exercise',{kind:'link'})}</div>`;
    sheet(workingTask,detail);
  }

  function savePreference(value) {
    enabled = value;
    storage.write(value);
  }

  function chooseFixture(value) {
    clearTimeout(refreshTimer);
    state = ['empty','studios'].includes(value) ? 'empty' : value;
    name = 'Мастерская Лугов';
    draft = undefined;
    planVersion = 1;
    route(value === 'empty' ? 'today' : value === 'studios' ? 'studios' : 'overview');
  }

  function publishSoon(delay = 650) {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      if (state !== 'training') return;
      if (productDialog.open || hideDialog.open) {
        publishSoon(2000);
        return;
      }
      state = 'complete';
      if (screen === 'overview' || screen === 'work') {
        const activeAction = document.activeElement.dataset.act;
        render();
        (activeAction && main.querySelector(`[data-act="${activeAction}"]`) || main.querySelector('h1'))?.focus();
      }
    },delay);
  }

  function updateProvider() {
    if (state === 'provider') state = 'draft';
    const feedback = (productDialog.open ? productDialog : main).querySelector('#provider-feedback');
    if (feedback) {
      feedback.hidden = false;
      feedback.textContent = 'Подключение готово.';
    }
  }

  const actions = {
    ...Object.fromEntries(Object.keys({...appViews, ...studioViews}).map(key => [key, () => route(key)])),
    new: newStudio,
    close: () => productDialog.close(),
    import: () => sheet('Импорт файла Hearth', '<p>В приложении здесь открывается системный выбор файла.</p>'),
    save: () => { productDialog.close(); render(); main.querySelector('[data-act="new"]')?.focus(); },
    'draft-back': () => { draft.step -= 1; newStudio(); },
    'select-folder': () => { draft.folder = '/Проекты'; newStudio(); },
    'provider-check': updateProvider,
    prepare: () => {
      state = 'planning'; render(); $('#content h1').focus();
      refreshTimer = setTimeout(() => {
        if (state !== 'planning') return;
        state = 'pending'; render();
      }, 750);
    },
    plan: () => plan(),
    'plan-tasks': () => planEditor(false),
    'plan-team': () => planEditor(true),
    'save-plan': () => { planVersion += 1; plan(); },
    revise: () => plan({revise:true}),
    'send-revision': () => { planVersion += 1; productDialog.close(); actions.prepare(); },
    approve: () => { state = 'training'; productDialog.close(); route('overview'); publishSoon(12000); },
    artifacts: () => { workPane = 'artifacts'; route('work'); },
    board: () => { workPane = 'board'; route('work'); },
    exercise,
    task,
    checks: () => sheet('Результаты проверок','<p>Проверка «Ссылки между персонажами» завершилась с ошибкой.</p><p class="muted">В биографии Мары ссылка ведёт на отсутствующий персонаж.</p>'),
    file: () => sheet(fileName,`<h3>Персонажи сборника</h3><p>${textReport}</p><p class="mock-path">/Проекты/Мастерская Лугов/${fileName}</p>`),
    location: () => sheet('Показать в папке',`<p class="mock-path">/Проекты/Мастерская Лугов/studio/artifacts/</p><p>В приложении этот файл выделяется в файловом менеджере.</p>`),
    copy: async () => {
      const feedback = $('#file-feedback');
      feedback.hidden = false;
      try { await navigator.clipboard.writeText('/Проекты/Мастерская Лугов/' + fileName); feedback.textContent = 'Путь скопирован.'; }
      catch { feedback.textContent = '/Проекты/Мастерская Лугов/' + fileName; }
    },
  };
  document.addEventListener('click', event => {
    const control = event.target.closest('button');
    if (!control) return;
    if (control.dataset.hintClose) {
      dismissTrigger = control;
      hideDialog.showModal();
      return;
    }
    actions[control.dataset.act]?.();
  });
  document.addEventListener('input', event => {
    const field = event.target;
    if (field.closest('#studio-form') && field.name) draft[field.name] = field.value;
  });
  document.addEventListener('change', event => {
    const field = event.target;
    if (field.id === 'setting-hints') savePreference(field.checked);
    if (field.id === 'settings-theme' || field.id === 'preview-theme') {
      document.documentElement.dataset.theme = field.value;
      $('#preview-theme').value = field.value;
      if ($('#settings-theme')) $('#settings-theme').value = field.value;
    }
    if (field.id === 'fixture') chooseFixture(field.value);
    if (field.closest('#studio-form') && field.name === 'mode') newStudio();
  });
  document.addEventListener('submit', event => {
    if (event.target.id !== 'studio-form') return;
    event.preventDefault();
    if (draft.step === 1 && !draft.folder) {
      $('#studio-error').hidden = false;
      productDialog.querySelector('[data-act=select-folder]').focus();
      return;
    }
    if (draft.step < 2) {
      draft.step += 1;
      newStudio();
      return;
    }
    name = draft.name.trim() || 'Мастерская Лугов';
    draft = undefined;
    state = 'draft';
    productDialog.close();
    route('overview');
  });
  function closeHintConfirmation(disable) {
    hideDialog.close();
    if (!disable) {
      dismissTrigger?.focus();
      return;
    }
    savePreference(false);
    for (const card of document.querySelectorAll('.hint-card')) {
      const row = card.closest('.hint-row');
      const anchor = row.firstElementChild;
      const place = row.parentElement;
      anchor.removeAttribute('aria-describedby');
      place.classList.add('standalone');
      place.replaceChildren(anchor);
    }
    const target = document.getElementById(dismissTrigger?.dataset.hintClose);
    (target ?? (productDialog.open ? $('#product-title') : $('main h1')))?.focus();
  }
  hideDialog.addEventListener('submit', event => {
    event.preventDefault();
    closeHintConfirmation(event.submitter?.value === 'disable');
  });
  hideDialog.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    event.preventDefault();
    closeHintConfirmation(false);
  });
  hideDialog.addEventListener('cancel', event => {
    event.preventDefault();
    closeHintConfirmation(false);
  });
  render();
</script>
</body>
</html>
