<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearth · Рабочее место владельца</title>
<style>
:root{color-scheme:light;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292923;background:#f4f3ee;--line:#d5d4c9;--quiet:#5d6056;--rust:#934528}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:#fffefa;border:1px solid var(--line);padding:.44rem .8rem;border-radius:5px;text-align:left}button:hover{border-color:#928878;background:#f4efe4}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ac5635;outline-offset:2px}header{background:#292923;color:#fffbef;display:flex;gap:1.2rem;align-items:center;padding:12px clamp(18px,4vw,64px);border-bottom:3px solid #bc7049}header b{font-family:Georgia,serif;font-size:1.55rem;font-weight:500}header small{color:#d8d5c8}header button{margin-left:auto;background:transparent;color:#f4efe4;border-color:#636257}header button:hover{background:#414038}main{max-width:1500px;margin:auto;padding:clamp(16px,3.5vw,54px)}h1,h2,h3,p,dl{margin:0}h1{font:500 clamp(34px,4vw,58px)/1.1 Georgia,serif;letter-spacing:-.045em}h2{font-size:1.12rem}h3{font-size:.96rem}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.intro p,small,.muted,dt{color:var(--quiet)}.intro p{margin-top:7px}.columns{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr);gap:26px;align-items:start}.panel{border:1px solid var(--line);background:#fffef9;border-radius:7px}.section{padding:18px 20px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.section>*+*{margin-top:10px}.label{font-size:.8rem;font-weight:650;color:var(--quiet)}.tabbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.tabbar{margin:0 0 18px}.tabbar button[aria-pressed=true]{background:#35382e;color:#fff;border-color:#35382e}.row{display:grid;width:100%;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:16px 18px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}.row[aria-current=true]{box-shadow:inset 3px 0 var(--rust);background:#f9f0e7}.row strong,.row small{display:block}.row small{margin-top:3px}.pill{font-size:.78rem;font-weight:600;white-space:nowrap;border-radius:3px;padding:3px 7px;color:#75421a;background:#fae8cd}.green{background:#e6edde;color:#3f583f}.blue{background:#e0ebef;color:#36576a}.neutral{background:#edece6;color:#57584e}.split{display:flex;align-items:center;gap:10px;justify-content:space-between}.primary{background:var(--rust);color:white;border-color:var(--rust)}.primary:hover{background:#71351e;color:white}.meta{display:grid;grid-template-columns:8rem 1fr;gap:5px 12px;font-size:.9rem}.meta dd{margin:0}.inspector h2{font:500 1.65rem/1.2 Georgia,serif}.artifact{padding:13px 15px;background:#f4f2ea;border-left:3px solid #aaa894}.artifact p{font-family:Georgia,serif}.artifact p+p{margin-top:.5rem}details{margin:10px 0}summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px}code,pre,time{font-family:ui-monospace,monospace;font-size:.83rem}pre{padding:12px;background:#edece7;white-space:pre-wrap;overflow-wrap:anywhere}.event{display:grid;grid-template-columns:3.1rem 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.event time{color:var(--quiet)}.spaced{margin-top:22px}input,textarea{display:block;width:100%;border:1px solid #aaa99d;border-radius:4px;padding:8px;background:#fff}textarea{min-height:64px}.notice{font-weight:600}.portfolio{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.portfolio button{width:100%;padding:20px;border-radius:7px;background:#fffef9}.portfolio strong,.portfolio small{display:block;margin:7px 0}.portfolio strong{font-size:1.2rem}.back{margin-bottom:18px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:820px){.columns{grid-template-columns:1fr}.intro{align-items:start;flex-direction:column}.row{padding:12px}.section{padding:15px}header{flex-wrap:wrap;gap:8px}header b{font-size:1.2rem}}@media(max-width:460px){.row{grid-template-columns:1fr}.pill{justify-self:start}.split{align-items:start;flex-wrap:wrap}.meta{grid-template-columns:6rem 1fr}}
.file-links{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}.file-links a{color:#804124;text-underline-offset:3px}.file-links a+a{font-size:.85rem}.file-links a:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
</style>
<header><b>Hearth Studio</b><small>Интерактивный макет · тестовые данные</small><a style="color:inherit" href="studio-work.html">Первый запуск и реестр</a><button id="reset">Начать заново</button></header>
<main id="screen"></main><div id="announcement" class="sr" aria-live="polite"></div>
<script>
const screen=document.querySelector('#screen');
const tasks=[
 {id:'release',title:'Обновить инструкцию запуска',owner:'Мира · технический редактор'},
 {id:'check',title:'Проверить сборку примеров',owner:'Илья · инженер'},
 {id:'publish',title:'Опубликовать руководство',owner:'Директор'}
];
let page,tab,selected,decision,reason,retrying,query;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(action,label,cls='')=>'<button type="button" class="'+cls+'" data-action="'+action+'">'+label+'</button>';
const pill=(text,cls='')=>'<span class="pill '+cls+'">'+text+'</span>';
function reset(){page='home';tab='overview';selected='release';decision='pending';reason='';retrying=false;query='';render()}
function status(id){
 if(id==='release')return decision==='pending'?['Нужна приёмка','']:decision==='accepted'?['Принято','green']:['На доработке','blue'];
 if(id==='check')return retrying?['В очереди','neutral']:['Сбой проверки',''];
 return decision==='accepted'?['Готова к запуску','green']:['Зависит от инструкции','neutral'];
}
function need(){return Number(decision==='pending')+Number(!retrying)}
function row(t){const [text,cls]=status(t.id);return '<button class="row" data-task="'+t.id+'" aria-current="'+(selected===t.id)+'"><span><strong>'+t.title+'</strong><small>'+t.owner+'</small></span>'+pill(text,cls)+'</button>'}
function events(){const e=[['10:41','Независимое ревью инструкции завершено.'],['10:38','Проверка примеров остановилась на загрузке зависимости.']];
 if(retrying)e.unshift(['Сейчас','Повторная проверка примеров поставлена в очередь.']);
 if(decision==='accepted')e.unshift(['Сейчас','Инструкция принята. Публикация готова к запуску.']);
 if(decision==='returned')e.unshift(['Сейчас','Инструкция возвращена Мире с замечанием.']);
 return e.map(([t,s])=>'<div class="event"><time>'+t+'</time><span>'+s+'</span></div>').join('')}
function inspector(){const task=tasks.find(t=>t.id===selected),[state,cls]=status(selected);
 const fileLinks=(file,id)=>'<div class="file-links"><a href="files/'+file+'" target="_blank" rel="noopener"><code>'+file+'</code></a><a href="files/index.html#'+id+'" target="_blank" rel="noopener" aria-label="Показать '+file+' в папке">Показать в папке</a></div>';
 let detail='';
 if(selected==='release'){
   detail='<section class="section"><h3>Что изменилось</h3><p>В README команды установки и проверки собраны в одном месте.</p><div class="artifact">'+fileLinks('README.md','readme')+'<p>Установите зависимости командой <code>npm ci</code>. Чтобы проверить среду и примеры, выполните <code>npm test</code>.</p></div></section>'+
   '<section class="section"><h3>Чем подтверждено</h3><dl class="meta"><dt>Тест инструкции</dt><dd>Пройден на чистом окружении</dd><dt>Ревью</dt><dd>Лев проверил обе команды</dd><dt>Версия</dt><dd><code>9be13f2</code></dd></dl><details><summary>Изменение и журнал проверки</summary>'+fileLinks('readme-check.txt','readme-check')+'<pre>README.md\n− npm install\n+ npm ci\n+ npm test\n\nПроверка инструкции · PASS\nКод выхода 0 · 12 секунд</pre></details></section>';
   if(decision==='pending')detail+='<section class="section"><h3>Ваше решение</h3><p>Принятие объединит проверенную версию с веткой <code>main</code> и откроет задачу публикации.</p><div class="actions">'+btn('accept','Принять версию','primary')+btn('revise','Вернуть на доработку')+'</div><form id="revision" hidden><label>Что нужно исправить<textarea required maxlength="500" name="note"></textarea></label><div class="actions spaced"><button class="primary" type="submit">Отправить Мире</button>'+btn('cancel-revise','Отмена')+'</div></form></section>';
   else detail+='<section class="section"><h3>Решение записано</h3><p class="notice">'+(decision==='accepted'?'Версия 9be13f2 принята в main.':'Мира получила замечание.')+'</p><p>'+(decision==='accepted'?'Задача «Опубликовать руководство» готова к запуску.':'«'+esc(reason)+'». Публикация ждёт нового результата и ревью.')+'</p>'+btn('show-publish','Открыть связанную задачу')+'</section>';
 }else if(selected==='check'){
   detail='<section class="section"><h3>Причина остановки</h3><p>Сервис зависимостей не ответил за 30 секунд. Сборка примеров ожидает повторной попытки.</p>'+fileLinks('examples-check.txt','examples-check')+'<details><summary>Журнал попытки</summary><pre>install examples · ETIMEDOUT\nКод выхода 1 · 30 секунд</pre></details></section><section class="section"><h3>Следующий шаг</h3><p>'+(retrying?'Илья получит задачу, когда освободится слот. Результат проверки пока неизвестен.':'Можно заново запустить этот шаг. Приёмка инструкции доступна независимо.')+'</p>'+(retrying?'':btn('retry','Повторить проверку','primary'))+'</section>';
 }else{
   detail='<section class="section"><h3>Условие запуска</h3><p>'+(decision==='accepted'?'Проверенная версия инструкции в main. Директор может назначить публикацию.':'Требуется принятая версия инструкции. Пока задача ожидает, команда продолжает независимую работу.')+'</p>'+btn('show-release','Открыть инструкцию')+'</section>';
 }
 return '<aside class="panel inspector" aria-labelledby="item-title"><div class="section">'+pill(state,cls)+'<h2 id="item-title" tabindex="-1">'+task.title+'</h2><p class="muted">'+task.owner+'</p></div>'+detail+'</aside>';
}
function list(){const visible=tasks.filter(t=>(t.title+' '+t.owner+' '+status(t.id)[0]).toLowerCase().includes(query.toLowerCase()));return visible.length?visible.map(row).join(''):'<p class="section muted">Совпадений нет.</p>'}
function render(){
 if(page==='home'){screen.innerHTML='<div class="intro"><div><h1>Все студии</h1><p>Состояние работы на текущий момент</p></div></div><div class="portfolio"><button data-action="enter">'+pill(need()?'Требует внимания':'Решения обработаны',need()?'':'green')+'<strong>Доставка</strong><small>Спринт 4 · выпуск руководства</small><span>'+(decision==='pending'?'Инструкция ждёт вашей приёмки':decision==='accepted'?'Инструкция принята':'Инструкция возвращена редактору')+'</span></button></div>';return}
 const pending=tasks.filter(t=>(t.id==='release'&&decision==='pending')||(t.id==='check'&&!retrying));
 screen.innerHTML=btn('home','← Все студии','back')+'<div class="intro"><div><h1>Доставка</h1><p>Спринт 4 · выпуск руководства</p></div></div><nav class="tabbar" aria-label="Раздел студии">'+['overview','tasks'].map(id=>'<button data-tab="'+id+'" aria-pressed="'+(tab===id)+'">'+(id==='overview'?'Обзор':'Все задачи · 3')+'</button>').join('')+'</nav><div class="columns"><div>'+
 (tab==='overview'?'<section class="panel"><div class="section split"><h2>Требует внимания</h2>'+pill(String(need()),need()?'':'green')+'</div>'+(pending.map(row).join('')||'<p class="section muted">Все решения обработаны.</p>')+'</section><section class="panel spaced"><div class="section"><h2>Последние изменения</h2>'+events()+'</div></section>':
 '<section class="panel"><div class="section"><h2>Задачи спринта</h2><label>Поиск по задаче, роли или состоянию<input id="search" type="search" value="'+esc(query)+'"></label></div><div id="rows">'+list()+'</div></section>')+
 '</div>'+inspector()+'</div>';
}
function focusItem(){document.querySelector('#item-title')?.focus({preventScroll:true});if(matchMedia('(max-width:820px)').matches)document.querySelector('.inspector')?.scrollIntoView({block:'start'})}
screen.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.task){selected=b.dataset.task;render();focusItem();return}
 if(b.dataset.tab){tab=b.dataset.tab;render();screen.querySelector('[aria-pressed=true]').focus();return}
 const a=b.dataset.action;
 if(a==='revise'||a==='cancel-revise'){const f=document.querySelector('#revision');f.hidden=a==='cancel-revise';if(!f.hidden)f.elements.note.focus();else screen.querySelector('[data-action=revise]').focus();return}
 if(a==='enter')page='studio';else if(a==='home')page='home';else if(a==='accept')decision='accepted';else if(a==='retry')retrying=true;else if(a==='show-release')selected='release';else if(a==='show-publish')selected='publish';else return;
 render();if(a==='home'||a==='enter'){const h=screen.querySelector('h1');h.tabIndex=-1;h.focus()}else focusItem();
});
screen.addEventListener('submit',e=>{if(e.target.id!=='revision')return;e.preventDefault();reason=e.target.elements.note.value.trim();if(!reason){e.target.elements.note.focus();return}decision='returned';render();focusItem()});
screen.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('#rows').innerHTML=list()}});
document.querySelector('#reset').addEventListener('click',()=>{reset();document.querySelector('#announcement').textContent='Тестовый сценарий сброшен.'});
reset();
</script></html>
